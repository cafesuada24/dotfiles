[general]
import = []
live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
decorations = "buttonless"
padding = { x = 0, y = 0 }
dynamic_padding = true
opacity = 0.9

[window.dimensions]
columns = 100
lines = 30

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font Mono"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font Mono"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font Mono"
style = "Bold Italic"

[cursor]
style = { shape = "block", blinking = "On"}
unfocused_hollow = true
