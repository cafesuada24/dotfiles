[general]
import = []
live_config_reload = true

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.95
blur = true

[window.dimensions]
columns = 100
lines = 30

[font]
size = 12.0

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[cursor.primary]
style = { shape = "block", blinking = "On"}
unfocused_hollow = true
